name: Wayback Download

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install downloader
        run: gem install wayback_machine_downloader

      - name: Download site
        run: wayback_machine_downloader https://aniwatch.to/ --from 20240215144406 --to 20240215144406

      - name: Fix gzip-compressed files
        run: |
          find websites/ -type f | while read -r f; do
            if file "$f" | grep -q "gzip compressed"; then
              echo "Decompressing: $f"
              gunzip -c "$f" > "$f.tmp" && mv "$f.tmp" "$f"
            fi
          done

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-archive
          path: websites/
